# Static SPA on Netlify (no Node API on this host)
[build]
  publish = "dist/public"
  command = "npx vite build"

# Forms: wec-registration, wec-sponsor, wec-contact, wec-organiser
# Enable email notifications: Netlify → Forms → Form notifications → Add notification

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
