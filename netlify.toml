# World Espresso Championship — Netlify frontend deploy
# Prerendered public routes → HTTP 200. Unknown paths → 404.html with true HTTP 404.
# No soft SPA rewrite (that caused soft-404s for crawlers).

[build]
  command = "npm run build:netlify"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

# Preview / branch deploys may build before legal identity is filled.
# Production (CONTEXT=production) always requires complete legalIdentity.
[context.deploy-preview.environment]
  WEC_ALLOW_INCOMPLETE_LEGAL = "1"

[context.branch-deploy.environment]
  WEC_ALLOW_INCOMPLETE_LEGAL = "1"

# Optional: proxy /api/* to your backend (Railway, etc.)
# Uncomment and set the target after the API is live:
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API-HOST/api/:splat"
#   status = 200
#   force = true

# No /* → /index.html 200 rewrite.
# Known routes are prerendered as /path/index.html.
# Netlify serves 404.html with HTTP 404 for everything else.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
