# World Espresso Championship — Netlify frontend deploy
# Connect this repo in Netlify (https://app.netlify.com) and deploy.
# Forms, store checkout, admin, and auth need a separate API host
# (see DEPLOYMENT_GUIDE.md). Set API_PROXY_URL below when ready.

[build]
  command = "npm run build:client"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

# Optional: proxy /api/* to your backend (Railway, etc.)
# Uncomment and set the target after the API is live:
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API-HOST/api/:splat"
#   status = 200
#   force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
